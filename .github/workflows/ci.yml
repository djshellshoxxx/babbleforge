name: CI

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { name: linux-clang, os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { name: windows-msvc, os: windows-latest, cc: cl,   cxx: cl }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

    - name: Build
      shell: bash
      run: cmake --build build -- -k 0

    - name: Test
      shell: bash
      run: ctest --test-dir build --output-on-failure

  app-windows:
    name: app-windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build-app -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
          -DBF_BUILD_APP=ON -DBF_BUILD_TESTS=OFF

    - name: Build
      shell: bash
      run: cmake --build build-app --target babbleforge-cli BabbleForge


  validation-python:
    name: validation-python
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install tools
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Build bfrender + bfanalyze
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBF_BUILD_TESTS=OFF
        cmake --build build --target bfrender bfanalyze

    - name: Install Python dependencies
      run: python -m pip install numpy scipy pytest soundfile

    - name: Python validation tests
      run: python -m pytest tools/validation -v

  app-linux:
    name: app-linux
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
          libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl-dev libsqlite3-dev

    - name: Configure
      run: |
        cmake -S . -B build-app -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DBF_BUILD_APP=ON -DBF_SQLITE_USE_SYSTEM=ON -DBF_BUILD_TESTS=OFF

    - name: Build
      run: cmake --build build-app --target babbleforge-cli BabbleForge

    - name: List devices (smoke)
      run: ./build-app/app/cli/babbleforge-cli_artefacts/Release/babbleforge-cli --list-devices
